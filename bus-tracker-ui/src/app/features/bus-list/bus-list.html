<div class="bus-container">
  <div class="search-row">
    <input
      type="text"
      placeholder="Search by service name, origin, or destination"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      aria-label="Search bus routes"
    />
  </div>

  <div class="status-message">
    <ng-container *ngIf="isLoading">
      <p>Loading buses...</p>
    </ng-container>
    <ng-container *ngIf="error && !isLoading">
      <p class="error">{{ error }}</p>
    </ng-container>
    <ng-container *ngIf="!isLoading && !error && filteredBuses.length === 0">
      <p>No routes found. Try a different search term.</p>
    </ng-container>
  </div>

  <div class="bus-grid" *ngIf="!isLoading && !error && filteredBuses.length > 0">
    <div class="bus-card" *ngFor="let bus of filteredBuses; trackBy: trackById">
      <div class="card-header">
        <h3>{{ bus.serviceName }}</h3>
        <span class="badge">#{{ bus.id }}</span>
      </div>
      <p class="route"><strong>Route:</strong> {{ bus.origin }} → {{ bus.destination }}</p>
      <p class="route" *ngIf="bus.viaPoints"><strong>Via:</strong> {{ bus.viaPoints }}</p>
      <p class="route"><strong>Departs:</strong> {{ bus.departureTime }}</p>
      <p class="route" *ngIf="bus.returnTime"><strong>Returns:</strong> {{ bus.returnTime }}</p>
      <button class="detail-btn" (click)="onViewDetails(bus)">View Details</button>
    </div>
  </div>
</div>
