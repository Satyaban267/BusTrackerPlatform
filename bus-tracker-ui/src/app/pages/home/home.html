<div class="home-container">
  <!-- Hero Section -->
  <section class="hero relative overflow-hidden">
    <div class="hero-bg absolute inset-0">
      <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=2000" alt="Scenic Road" class="w-full h-full object-cover opacity-30">
      <div class="hero-gradient absolute inset-0"></div>
    </div>

    <div class="container relative z-10 py-xxl">
      <div class="hero-content max-w-7xl">
        <h1 class="h1 animate-slide-up mb-md">
          Your Way <span style="color: var(--color-primary);">Home</span>
        </h1>
        <p class="subtitle animate-slide-up mb-xl" style="animation-delay: 100ms;">
          Safe, reliable bus schedules for your daily journey between village and city.
        </p>

        <!-- Search Card -->
        <div class="card glass animate-slide-up search-card" style="max-width: 600px; animation-delay: 200ms;">
          <div class="flex flex-col gap-lg">
            <div class="input-group">
              <label class="text-xs text-bold">Start From</label>
              <div class="flex items-center bg-surface p-sm rounded-md">
                <span class="material-symbols-rounded" style="color: var(--color-primary); padding: 0 var(--spacing-sm);">location_on</span>
                <input
                  type="text"
                  placeholder="Village or Stop Name"
                  class="input-field"
                  style="background: transparent; border: none; box-shadow: none;"
                  [(ngModel)]="from"
                  (keyup.enter)="findBus()"
                  id="from-input"
                >
              </div>
            </div>

            <div class="flex justify-center swap-row">
              <button class="btn-icon glass shadow-md swap-btn" (click)="swapLocations()" title="Swap locations" type="button">
                <span class="material-symbols-rounded">swap_vert</span>
              </button>
            </div>

            <div class="input-group">
              <label class="text-xs text-bold">Going To</label>
              <div class="flex items-center bg-surface p-sm rounded-md">
                <span class="material-symbols-rounded" style="color: var(--color-secondary); padding: 0 var(--spacing-sm);">apartment</span>
                <input
                  type="text"
                  placeholder="City or Destination"
                  class="input-field"
                  style="background: transparent; border: none; box-shadow: none;"
                  [(ngModel)]="to"
                  (keyup.enter)="findBus()"
                  id="to-input"
                >
              </div>
            </div>

            <button class="btn btn-primary w-full mt-md" (click)="findBus()" type="button">
              <span class="material-symbols-rounded">search</span> Find My Bus
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
