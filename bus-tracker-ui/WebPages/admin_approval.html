<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Digital Hearth | Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#ffe9e4",
                    "on-primary-fixed": "#3b0800",
                    "on-surface": "#2b1611",
                    "on-surface-variant": "#5a413a",
                    "tertiary-fixed": "#ffdcc7",
                    "outline-variant": "#e2bfb6",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#ffb5a1",
                    "on-tertiary-fixed": "#311300",
                    "surface-tint": "#b22c01",
                    "surface-container-highest": "#ffdad2",
                    "surface": "#fff8f6",
                    "surface-variant": "#ffdad2",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#ffe2d2",
                    "surface-dim": "#f9d1c8",
                    "background": "#fff8f6",
                    "on-secondary-fixed": "#002204",
                    "inverse-primary": "#ffb5a1",
                    "inverse-surface": "#432a25",
                    "secondary-fixed-dim": "#88d982",
                    "on-tertiary-fixed-variant": "#723600",
                    "secondary": "#1b6d24",
                    "tertiary-container": "#a45100",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#bf360c",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#a3f69c",
                    "on-primary-container": "#ffe1da",
                    "tertiary-fixed-dim": "#ffb787",
                    "surface-container-high": "#ffe2db",
                    "primary-fixed": "#ffdbd1",
                    "surface-container-low": "#fff0ed",
                    "surface-bright": "#fff8f6",
                    "on-background": "#2b1611",
                    "tertiary": "#803d00",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#a0f399",
                    "outline": "#8e7069",
                    "on-secondary-container": "#217128",
                    "on-primary-fixed-variant": "#881f00",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary": "#982400",
                    "inverse-on-surface": "#ffede9",
                    "on-secondary-fixed-variant": "#005312"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "display": ["Plus Jakarta Sans"],
                    "body": ["Public Sans"],
                    "label": ["Public Sans"]
            }
          },
        },
      }

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Public Sans', sans-serif;
        background-color: #fff8f6;
        color: #2b1611;
      }
      h1, h2, h3, .brand-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
    </script>
</head>
<body class="min-h-screen flex bg-surface">

    <!-- SideNavBar Component -->
    <aside class="fixed left-0 top-0 h-full flex flex-col p-4 z-50 bg-[#fff8f6] dark:bg-stone-950 h-full w-72 shadow-2xl dark:shadow-none font-plus-jakarta-sans text-stone-900 dark:text-stone-100">
        <div class="mb-8 px-4">
            <span class="text-xl font-bold text-[#982400] tracking-tight">The Digital Hearth</span>
            <p class="text-[10px] text-on-surface-variant font-semibold tracking-widest uppercase mt-1">Admin Portal</p>
        </div>

        <nav class="flex-1 flex flex-col gap-2">
            <!-- Active Navigation -->
            <a href="#" class="flex items-center gap-3 bg-[#ffe9e4] dark:bg-[#5a1a00] text-[#982400] dark:text-[#ffdad2] rounded-xl px-4 py-3 font-bold active:opacity-80 transition-all">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
                <span>Home</span>
            </a>
            <a href="#" class="flex items-center gap-3 text-stone-600 dark:text-stone-400 px-4 py-3 hover:bg-[#fff0ed] dark:hover:bg-stone-800 transition-all">
                <span class="material-symbols-outlined">directions_bus</span>
                <span>Active Buses</span>
            </a>
            <a href="#" class="flex items-center gap-3 text-stone-600 dark:text-stone-400 px-4 py-3 hover:bg-[#fff0ed] dark:hover:bg-stone-800 transition-all">
                <span class="material-symbols-outlined">chat_bubble</span>
                <span>User Feedback</span>
            </a>
            <a href="#" class="flex items-center gap-3 text-stone-600 dark:text-stone-400 px-4 py-3 hover:bg-[#fff0ed] dark:hover:bg-stone-800 transition-all">
                <span class="material-symbols-outlined">settings</span>
                <span>Settings</span>
            </a>
        </nav>

        <div class="mt-auto p-4 bg-surface-container-low rounded-2xl">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
                    <span class="material-symbols-outlined">person</span>
                </div>
                <div>
                    <p class="text-sm font-bold text-on-surface leading-tight">Welcome, Passenger</p>
                    <p class="text-xs text-on-surface-variant">Reliable transport for all</p>
                </div>
            </div>
            <button class="w-full bg-primary text-white py-2 rounded-full text-sm font-bold active:scale-95 transition-transform">
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content Canvas -->
    <main class="flex-1 ml-72 p-8 max-w-7xl">
        
        <!-- Header / TopAppBar area -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl font-extrabold text-on-surface tracking-tight mb-2">Service Approvals</h1>
                <p class="text-on-surface-variant font-medium">Review and manage the latest fleet additions and community requests.</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-surface-container-high px-6 py-3 rounded-2xl flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary">pending_actions</span>
                    <div>
                        <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Pending Tasks</p>
                        <p class="text-lg font-extrabold text-on-surface">14 Requests</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Bento Grid Layout for Sections -->
        <div class="grid grid-cols-12 gap-6">
            
            <!-- Tab Switcher (Asymmetric Design) -->
            <div class="col-span-12 flex gap-4 mb-2">
                <button class="px-8 py-3 bg-primary text-on-primary rounded-full font-bold shadow-lg shadow-primary/20 flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
                    New Registrations
                </button>
                <button class="px-8 py-3 bg-surface-container-low text-on-surface rounded-full font-bold hover:bg-surface-container-high transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">group</span>
                    Community Suggestions
                </button>
            </div>

            <!-- Main Content Area: List of Requests -->
            <div class="col-span-12 space-y-6">
                
                <!-- Entry 1: Professional Registration -->
                <div class="bg-surface-container-low rounded-[2rem] p-6 flex flex-col md:flex-row gap-8 items-start relative overflow-hidden">
                    <div class="absolute top-0 left-0 h-full w-2 bg-tertiary rounded-full"></div>
                    
                    <div class="w-full md:w-1/4">
                        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=600" 
                             class="w-full h-48 object-cover rounded-3xl" 
                             data-alt="A brightly painted orange and yellow rural passenger bus parked on a dusty roadside under the golden hour sun. The bus has traditional hand-painted floral motifs and looks well-maintained. The atmosphere is warm and nostalgic, capturing the essence of local community transport in a rural setting with soft shadows and rich earthy tones.">
                    </div>

                    <div class="flex-1 space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-tertiary-fixed text-on-tertiary-fixed text-[10px] px-3 py-1 rounded-full font-extrabold uppercase tracking-widest mb-2 inline-block">Express Service</span>
                                <h3 class="text-2xl font-bold text-on-surface">Hearth-Link #442</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Owner Contact</p>
                                <p class="font-bold text-on-surface">+91 98765-43210</p>
                                <p class="text-sm text-on-surface-variant italic">Rajesh Kumar Motors</p>
                            </div>
                        </div>

                        <!-- Route Thread Visualization -->
                        <div class="flex items-center gap-4 py-2">
                            <div class="flex flex-col items-center">
                                <div class="w-3 h-3 rounded-full bg-secondary"></div>
                                <div class="w-1 h-12 bg-secondary-fixed"></div>
                                <div class="w-3 h-3 rounded-full bg-secondary"></div>
                            </div>
                            <div class="flex flex-col justify-between h-16 py-1">
                                <div class="leading-none">
                                    <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter">Departure</p>
                                    <p class="font-bold text-on-surface">Main Square Terminal</p>
                                </div>
                                <div class="leading-none">
                                    <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter">Destination</p>
                                    <p class="font-bold text-on-surface">Riverside Community Hub</p>
                                </div>
                            </div>
                            <div class="ml-12 border-l border-outline-variant pl-8">
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Proposed Timings</p>
                                <div class="flex gap-2 mt-1">
                                    <span class="bg-surface-container px-3 py-1 rounded-lg text-sm font-bold text-on-surface">06:30 AM</span>
                                    <span class="bg-surface-container px-3 py-1 rounded-lg text-sm font-bold text-on-surface">02:15 PM</span>
                                    <span class="bg-surface-container px-3 py-1 rounded-lg text-sm font-bold text-on-surface">08:00 PM</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full md:w-auto">
                        <button class="bg-secondary text-white px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:shadow-lg transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">check_circle</span>
                            Approve
                        </button>
                        <button class="bg-surface-container-high text-error px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:bg-error-container transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">cancel</span>
                            Reject
                        </button>
                    </div>
                </div>

                <!-- Entry 2: Community Suggestion -->
                <div class="bg-surface-container-low rounded-[2rem] p-6 flex flex-col md:flex-row gap-8 items-start relative overflow-hidden">
                    <div class="absolute top-0 left-0 h-full w-2 bg-secondary rounded-full"></div>
                    
                    <div class="w-full md:w-1/4">
                        <div class="w-full h-48 bg-secondary-container rounded-3xl flex items-center justify-center relative overflow-hidden">
                             <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-on-secondary-container via-transparent to-transparent"></div>
                             <span class="material-symbols-outlined text-6xl text-secondary opacity-40">volunteer_activism</span>
                             <div class="absolute bottom-4 left-4 right-4 text-center">
                                 <p class="text-xs font-bold text-on-secondary-container">Community Requested Route</p>
                             </div>
                        </div>
                    </div>

                    <div class="flex-1 space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-secondary-fixed text-on-secondary-fixed text-[10px] px-3 py-1 rounded-full font-extrabold uppercase tracking-widest mb-2 inline-block">New Route Idea</span>
                                <h3 class="text-2xl font-bold text-on-surface">Valley Primary School Loop</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Suggested By</p>
                                <p class="font-bold text-on-surface">Amit S. & 42 others</p>
                                <p class="text-sm text-on-surface-variant italic">Student Council Member</p>
                            </div>
                        </div>

                        <p class="text-on-surface-variant text-sm leading-relaxed max-w-xl bg-surface p-4 rounded-2xl border border-outline-variant/15">
                            "Currently students have to walk 4km to reach the main road. A morning and afternoon pickup loop between the Valley School and the Junction would benefit 150+ students daily."
                        </p>

                        <div class="flex items-center gap-12 py-2">
                             <div>
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Requested Route</p>
                                <p class="font-bold text-on-surface">Valley Gate <span class="text-primary px-2">→</span> Junction</p>
                             </div>
                             <div>
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Ideal Time</p>
                                <p class="font-bold text-on-surface">07:30 AM - 08:30 AM</p>
                             </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full md:w-auto">
                        <button class="bg-primary text-white px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:shadow-lg transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">add_task</span>
                            Open Tender
                        </button>
                        <button class="bg-surface-container-high text-on-surface-variant px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:bg-surface-container-highest transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">archive</span>
                            Archive
                        </button>
                    </div>
                </div>

                <!-- Entry 3: Professional Registration (Waitlisted) -->
                <div class="bg-surface-container-low rounded-[2rem] p-6 flex flex-col md:flex-row gap-8 items-start relative overflow-hidden">
                    <div class="absolute top-0 left-0 h-full w-2 bg-primary rounded-full"></div>
                    
                    <div class="w-full md:w-1/4">
                        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=601" 
                             class="w-full h-48 object-cover rounded-3xl" 
                             data-alt="A detailed side profile of a modern, clean white bus with green leaf patterns along the side. The bus is parked in a lush green countryside terminal with mountains visible in the distance. The lighting is crisp and clear, emphasizing a sense of eco-friendliness and reliability. The overall palette is grounded in whites, deep greens, and warm earth tones.">
                    </div>

                    <div class="flex-1 space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-primary-fixed text-on-primary-fixed-variant text-[10px] px-3 py-1 rounded-full font-extrabold uppercase tracking-widest mb-2 inline-block">Eco-Local Service</span>
                                <h3 class="text-2xl font-bold text-on-surface">Greenway #09</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Owner Contact</p>
                                <p class="font-bold text-on-surface">+91 99000-11223</p>
                                <p class="text-sm text-on-surface-variant italic">Eco-Travels Ltd.</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 py-2">
                            <div class="flex flex-col items-center">
                                <div class="w-3 h-3 rounded-full bg-primary"></div>
                                <div class="w-1 h-12 bg-primary-fixed"></div>
                                <div class="w-3 h-3 rounded-full bg-primary"></div>
                            </div>
                            <div class="flex flex-col justify-between h-16 py-1">
                                <div class="leading-none">
                                    <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter">Departure</p>
                                    <p class="font-bold text-on-surface">North Highlands Stop</p>
                                </div>
                                <div class="leading-none">
                                    <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter">Destination</p>
                                    <p class="font-bold text-on-surface">Central Market St.</p>
                                </div>
                            </div>
                            <div class="ml-12 border-l border-outline-variant pl-8">
                                <p class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant">Proposed Timings</p>
                                <div class="flex gap-2 mt-1">
                                    <span class="bg-surface-container px-3 py-1 rounded-lg text-sm font-bold text-on-surface">09:00 AM</span>
                                    <span class="bg-surface-container px-3 py-1 rounded-lg text-sm font-bold text-on-surface">06:00 PM</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full md:w-auto">
                        <button class="bg-secondary text-white px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:shadow-lg transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">check_circle</span>
                            Approve
                        </button>
                        <button class="bg-surface-container-high text-error px-8 py-3 rounded-full font-bold flex items-center justify-center gap-2 hover:bg-error-container transition-all active:scale-95">
                            <span class="material-symbols-outlined text-sm">cancel</span>
                            Reject
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Pagination / Footer Info -->
        <footer class="mt-12 py-8 flex justify-between items-center border-t border-outline-variant/20">
            <p class="text-on-surface-variant text-sm font-medium">Showing <span class="font-bold text-on-surface">3</span> of <span class="font-bold text-on-surface">14</span> pending approvals</p>
            <div class="flex gap-2">
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-white font-bold">1</button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">2</button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">3</button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </footer>

    </main>

    <!-- Contextual FAB - suppressed for details/admin views based on relevance but let's add an 'Add Manual Entry' for admin utility if needed -->
    <!-- Suppressed as per rule for Settings/Details screens, let's keep the UI focused on the review tasks -->

</body>
</html></style></head><body></body></html>
